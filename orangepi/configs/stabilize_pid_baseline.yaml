# Softdrone ArduCopter manual/STABILIZE attitude-controller baseline
# Captured from the aircraft on 2026-10-02.
#
# Apply only while DISARMED:
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/stabilize_pid_baseline.yaml
#
# These are runtime ArduPilot AP_Param values. Applying them does NOT require
# rebuilding or reflashing firmware.

version: 1

profile:
  name: stabilize_pid_baseline
  airframe: softdrone
  description: Current ArduCopter attitude/rate controller baseline captured 2026-10-02.

parameters:
  angle_loop:
    ATC_ANG_RLL_P: 4.5
    ATC_ANG_PIT_P: 4.5
    ATC_ANG_YAW_P: 4.5

  rate_roll:
    ATC_RAT_RLL_P: 0.135
    ATC_RAT_RLL_I: 0.135
    ATC_RAT_RLL_D: 0.0036
    ATC_RAT_RLL_FF: 0.0

  rate_pitch:
    ATC_RAT_PIT_P: 0.135
    ATC_RAT_PIT_I: 0.135
    ATC_RAT_PIT_D: 0.0036
    ATC_RAT_PIT_FF: 0.0

  rate_yaw:
    ATC_RAT_YAW_P: 0.18
    ATC_RAT_YAW_I: 0.018
    ATC_RAT_YAW_D: 0.0
    ATC_RAT_YAW_FF: 0.0

  input_shaping:
    ATC_INPUT_TC: 0.15
