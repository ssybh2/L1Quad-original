# Mode29 geometric-controller gain/tilt scheduling calibration profile
#
# Scheduled by motor thrust-effectiveness loss:
#   position/velocity: KPX/KPY/KPZ, KVX/KVY/KVZ
#   attitude/rate:     KRX/KRY/KRZ, KOX/KOY/KOZ
#   safety envelope:  maximum combined roll/pitch tilt (deg)
#
# L1 adaptation parameters remain fixed.
#
# M29_GS_MODE:
#   0 = disabled: use normal GEOCTRL_* plus M29_MAX_TILT
#   1 = oracle calibration: use the known injected loss percentage
#   2 = automatic: use onboard blind-FDI loss estimate
#
# Calibration workflow:
#   1. keep M29_GS_MODE=1
#   2. tune one loss anchor at a time (50, 60, 70, ...)
#   3. edit only that anchor
#   4. apply while DISARMED
#   5. inject the matching --loss and evaluate the BIN log
#
# 50% retains the previously validated gains.
# 60% stores the validated position-loop gains supplied on 2026-10-06.
# New KR/KO/tilt anchors initially equal the current working baseline until
# they are deliberately tuned.

version: 2

profile:
  name: mode29_geometric_gain_schedule
  airframe: softdrone
  description: Oracle/FDI gain and tilt schedule for Mode29 geometric control.
  firmware_branch: feature/mode29-position-gain-schedule

parameters:
  scheduler:
    M29_GS_MODE: 1

  loss_50:
    M29_G50_KPX: 4.0
    M29_G50_KPY: 4.0
    M29_G50_KPZ: 10.0
    M29_G50_KVX: 4.0
    M29_G50_KVY: 4.0
    M29_G50_KVZ: 2.0
