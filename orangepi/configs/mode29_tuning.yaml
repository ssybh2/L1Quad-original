# Softdrone Mode 29 CURRENT tuning profile
#
# Purpose:
#   - This is the single working Mode29 profile for real-airframe testing.
#   - Edit this file when tuning Mode29.
#   - Keep mode29_baseline.yaml unchanged as the recovery reference.
#
# Firmware:
#   feature/softdrone-0189-runtime-takeoff
#   f66904aa8a4e205d387b25a185aa9082e94fc911
#
# Apply only while DISARMED:
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/mode29_tuning.yaml --dry-run
#
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/mode29_tuning.yaml
#
# First no-fault flight:
#   1.0 m target altitude
#   6.0 s smooth takeoff
#   2.0 s settle time before fault injection is allowed

version: 1

profile:
  name: mode29_tuning
  airframe: softdrone
  description: Current real-airframe Mode29 working profile based on the 0189 safety baseline with runtime-configurable takeoff.
  firmware_branch: feature/softdrone-0189-runtime-takeoff

parameters:
  trajectory:
    M29_TKOFF_ALT: 1.0
    M29_TKOFF_T: 6.0
    M29_SETTLE_T: 2.0

  geometric_position:
    GEOCTRL_KPX: 2.0
    GEOCTRL_KPY: 2.0
    GEOCTRL_KPZ: 0.2

  geometric_velocity:
    GEOCTRL_KVX: 1.5
    GEOCTRL_KVY: 0.9
    GEOCTRL_KVZ: 0.2

  geometric_attitude:
    GEOCTRL_KRX: 0.55
    GEOCTRL_KRY: 0.35
    GEOCTRL_KRZ: 0.15

  geometric_rate:
    GEOCTRL_KOX: 0.035
    GEOCTRL_KOY: 0.030
    GEOCTRL_KOZ: 0.004

  l1:
    L1ENABLE: 0
    ASV: -5.0
    ASOMEGA: -10.0
    CTOFFQ1THRUST: 30.0
    CTOFFQ1MOMENT: 5.0
    CTOFFQ2MOMENT: 15.0
