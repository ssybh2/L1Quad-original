# Softdrone Mode 29 CURRENT tuning profile
#
# Purpose:
#   - This is the single working Mode29 profile for real-airframe testing.
#   - Edit this file when tuning Mode29.
#   - This is the only Mode29 YAML profile kept in the repository.
#
# Firmware:
#   feature/softdrone-0189-runtime-takeoff
#   d1cf4266b49cde64030229c1d0766fda03cb3b87
#
# Apply only while DISARMED:
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/mode29_tuning.yaml --dry-run
#
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/mode29_tuning.yaml
#
# Current no-fault tuning:
#   1.0 m target altitude
#   10.0 s smooth takeoff
#   2.0 s settle time before fault injection is allowed
#   30 deg maximum combined roll/pitch tilt

version: 1

profile:
  name: mode29_tuning
  airframe: softdrone
  description: Current real-airframe Mode29 working profile with runtime-configurable takeoff.
  firmware_branch: feature/softdrone-0189-runtime-takeoff

parameters:
  trajectory:
    M29_TKOFF_ALT: 1.0
    M29_TKOFF_T: 10.0
    M29_SETTLE_T: 2.0

  safety:
    # Combined roll/pitch tilt cone in degrees. The firmware keeps the
    # commanded thrust direction upright and will never command inversion.
    M29_MAX_TILT: 30.0

  geometric_position:
    GEOCTRL_KPX: 0.5
    GEOCTRL_KPY: 0.7
    GEOCTRL_KPZ: 10.0

  geometric_velocity:
    GEOCTRL_KVX: 0.3
    GEOCTRL_KVY: 0.3
    GEOCTRL_KVZ: 6.0

  geometric_attitude:
    GEOCTRL_KRX: 0.55
    GEOCTRL_KRY: 0.35
    GEOCTRL_KRZ: 0.15

  geometric_rate:
    GEOCTRL_KOX: 0.035
    GEOCTRL_KOY: 0.030
    GEOCTRL_KOZ: 0.004

  l1:
    L1ENABLE: 0
    ASV: -5.0
    ASOMEGA: -10.0
    CTOFFQ1THRUST: 30.0
    CTOFFQ1MOMENT: 5.0
    CTOFFQ2MOMENT: 15.0
