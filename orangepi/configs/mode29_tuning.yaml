# Softdrone Mode 29 CURRENT tuning profile
#
# Purpose:
#   - This is the single working Mode29 profile for real-airframe testing.
#   - Edit this file when tuning Mode29.
#   - This is the only Mode29 YAML profile kept in the repository.
#
# Apply only while DISARMED:
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/mode29_tuning.yaml --dry-run
#
#   python3 orangepi/apply_flight_config.py \
#     orangepi/configs/mode29_tuning.yaml
#
# Current no-fault tuning:
#   1.0 m target altitude
#   1.0 s smooth takeoff
#   2.0 s settle time before fault injection is allowed
#   30 deg maximum combined roll/pitch tilt

version: 1

profile:
  name: mode29_tuning
  airframe: softdrone
  description: Current real-airframe Mode29 working profile with runtime-configurable takeoff.
  firmware_branch: feature/mode29-position-gain-schedule

parameters:
  trajectory:
    M29_TKOFF_ALT: 1.0
    M29_TKOFF_T: 1.0
    M29_SETTLE_T: 2.0

  safety:
    M29_MAX_TILT: 30.0
    # Standard profile keeps gain scheduling disabled. Use
    # mode29_position_gain_schedule.yaml explicitly for calibration/automatic mode.
    M29_GS_MODE: 0

  geometric_position:
    GEOCTRL_KPX: 4.0
    GEOCTRL_KPY: 4.0
    GEOCTRL_KPZ: 10.0

  geometric_velocity:
    GEOCTRL_KVX: 4.0
    GEOCTRL_KVY: 4.0
    GEOCTRL_KVZ: 2.0

  geometric_attitude:
    GEOCTRL_KRX: 1.0
    GEOCTRL_KRY: 0.5
    GEOCTRL_KRZ: 0.25

  geometric_rate:
    GEOCTRL_KOX: 0.1
    GEOCTRL_KOY: 0.2
    GEOCTRL_KOZ: 0.1

  l1:
    L1ENABLE: 1
    ASV: -10.0
    ASOMEGA: -15.0
    CTOFFQ1THRUST: 15.0
    CTOFFQ1MOMENT: 5.0
    CTOFFQ2MOMENT: 15.0
