name: MuJoCo opposite-pair experiment checks

on:
  push:
    branches:
      - feature/mujoco-opposite-pair-20261008
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MuJoCo and NumPy
        run: python -m pip install -r requirements.txt
      - name: Compile-check source code
        run: python -m py_compile mode29_mujoco.py opposite_pair_sim.py tests/test_opposite_pair.py
      - name: Check opposite pair allocation and fault guards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Headless paired fault smoke simulation
        run: python mode29_mujoco.py --config config_opposite_pair.toml --headless --no-realtime --duration 24
      - name: Upload simulation log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode29-opposite-pair-headless-csv
          path: logs/mode29_opposite_pair.csv
          if-no-files-found: warn
