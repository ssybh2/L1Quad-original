name: MuJoCo opposite-pair experiment checks

on:
  push:
    branches:
      - feature/mujoco-opposite-pair-20261008
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MuJoCo and NumPy
        run: python -m pip install -r requirements.txt
      - name: Compile-check source code
        run: python -m py_compile mode29_mujoco.py opposite_pair_sim.py tests/test_opposite_pair.py
      - name: Check opposite pair allocation and fault guards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Blind-FDI headless simulation (may refuse to engage)
        run: |
          python mode29_mujoco.py --config config_opposite_pair.toml --headless --no-realtime --duration 24
          cp logs/mode29_opposite_pair.csv logs/mode29_opposite_pair_blind.csv
      - name: Oracle headless control-allocation comparison (SIM ONLY)
        run: |
          python mode29_mujoco.py --config config_opposite_pair.toml --headless --no-realtime --duration 24 --pair-oracle
          cp logs/mode29_opposite_pair.csv logs/mode29_opposite_pair_oracle.csv
      - name: Assert that oracle case actually exercises pair mode
        run: |
          python -c "import csv; rows=list(csv.DictReader(open('logs/mode29_opposite_pair_oracle.csv'))); active=sum(int(x['pair_active']) for x in rows); print('pair_active samples:',active); assert active>0, 'oracle pair mode never engaged'"
      - name: Summarize both paired-fault simulations
        run: |
          python analyze_pair_log.py logs/mode29_opposite_pair_blind.csv
          python analyze_pair_log.py logs/mode29_opposite_pair_oracle.csv
      - name: Input coverage for arbitrary loss fractions (not flight validation)
        run: |
          for loss in 0 23.7 81.3 100; do
            echo "Testing injected motor loss: ${loss}%"
            python mode29_mujoco.py --config config_opposite_pair.toml --pair-oracle --headless --no-realtime --duration 16.2 --loss-percent "$loss"
            cp logs/mode29_opposite_pair.csv "logs/mode29_opposite_pair_loss_${loss}.csv"
          done
      - name: Upload simulation log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode29-opposite-pair-headless-csv
          path: logs/mode29_opposite_pair_*.csv
          if-no-files-found: warn
