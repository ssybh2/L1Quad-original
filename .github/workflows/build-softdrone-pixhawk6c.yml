name: Build Softdrone Pixhawk6C firmware

on:
  push:
    branches:
      - softdrone
      - feature/mode29-fdi-recovery
  workflow_dispatch:

jobs:
  build-pixhawk6c:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository and ArduPilot submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install ArduPilot prerequisites and L1Quad customization
        shell: bash
        run: |
          chmod +x installation.sh
          ./installation.sh

      - name: Build ArduCopter for Pixhawk6C / Pixhawk 6C Mini
        shell: bash
        run: |
          . ~/.profile
          cd ardupilot
          ./waf configure --board Pixhawk6C
          ./waf copter -j2

      - name: Show firmware files
        shell: bash
        run: |
          ls -lh ardupilot/build/Pixhawk6C/bin/

      - name: Upload flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: mode29-fdi-recovery-pixhawk6c-firmware
          path: |
            ardupilot/build/Pixhawk6C/bin/arducopter.apj
            ardupilot/build/Pixhawk6C/bin/arducopter.bin
          if-no-files-found: error
